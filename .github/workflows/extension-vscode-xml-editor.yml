# Builds, tests, packages, and publishes the XML Editor extension for Visual Studio Code.
#
# Every push and pull request that touches the extension type-checks it, runs the unit tests, runs
# the end-to-end checks inside a real VS Code, and uploads the packaged VSIX as an artifact.
#
# On main (a push or a manual run) the publish job releases that same VSIX to the Visual Studio
# Marketplace when package.json carries a version the Marketplace does not list yet, and otherwise
# records that there was nothing to publish. Marketplace versions are immutable — unlike the GitHub
# Packages feed the libraries use, a version cannot be replaced — so a release is "bump `version` in
# package.json and merge". The publish job reads the organization secret VS_MARKETPLACE_TOKEN (an
# Azure DevOps PAT with Marketplace > Manage scope for the assimalign publisher), the same credential
# the viu repository's Visual Studio Code publish uses, and pauses at the
# visual-studio-code-marketplace environment so protection rules can gate it.
name: VS Code XML Editor

on:
  push:
    paths:
      - "extensions/VisualStudioCode/xml-editor/**"
      - ".github/workflows/extension-vscode-xml-editor.yml" # When Pipeline File Changes
  pull_request:
    paths:
      - "extensions/VisualStudioCode/xml-editor/**"
      - ".github/workflows/extension-vscode-xml-editor.yml"
  workflow_dispatch:
    inputs:
      pre-release:
        description: Publish on the Marketplace pre-release channel.
        type: boolean
        default: false

# Never cancel a run on main mid-publish; superseded branch runs can go.
concurrency:
  group: vscode-xml-editor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build, test, and package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/VisualStudioCode/xml-editor
    outputs:
      name: ${{ steps.manifest.outputs.name }}
      publisher: ${{ steps.manifest.outputs.publisher }}
      version: ${{ steps.manifest.outputs.version }}
      vsix: ${{ steps.manifest.outputs.vsix }}
      pre-release: ${{ steps.manifest.outputs.pre-release }}
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/VisualStudioCode/xml-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests in VS Code
        # Downloads the current stable VS Code into .vscode-test/ and drives it under a virtual display.
        run: xvfb-run -a npm run test:integration

      - name: Read extension identity
        id: manifest
        shell: pwsh
        env:
          PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pre-release }}
        run: |
          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($manifest.version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "package.json version '$($manifest.version)' must be numeric MAJOR.MINOR.PATCH for the Marketplace."
          }

          $preRelease = if ($env:PRE_RELEASE -eq 'true') { 'true' } else { 'false' }
          $vsix = "$($manifest.name)-$($manifest.version).vsix"
          "name=$($manifest.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publisher=$($manifest.publisher)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vsix=$vsix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pre-release=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "$($manifest.publisher).$($manifest.name) $($manifest.version), pre-release=$preRelease"

      - name: Package VSIX
        shell: pwsh
        env:
          PRE_RELEASE: ${{ steps.manifest.outputs.pre-release }}
          VSIX: ${{ steps.manifest.outputs.vsix }}
        run: |
          $arguments = @('package', '--out', "$env:RUNNER_TEMP/$env:VSIX")
          if ($env:PRE_RELEASE -eq 'true') {
            $arguments += '--pre-release'
          }

          & npx --no-install vsce @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "vsce package failed with exit code $LASTEXITCODE."
          }

      - name: Validate VSIX
        shell: pwsh
        env:
          EXPECTED_NAME: ${{ steps.manifest.outputs.name }}
          EXPECTED_PUBLISHER: ${{ steps.manifest.outputs.publisher }}
          EXPECTED_VERSION: ${{ steps.manifest.outputs.version }}
          PRE_RELEASE: ${{ steps.manifest.outputs.pre-release }}
          VSIX: ${{ steps.manifest.outputs.vsix }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packagePath = Join-Path $env:RUNNER_TEMP $env:VSIX
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('extension.vsixmanifest', 'extension/package.json', 'extension/out/src/extension.js', 'extension/schemas/XMLSchema.xsd', 'extension/readme.md', 'extension/LICENSE.txt')) {
              if ($entries -notcontains $required) {
                throw "The VSIX is missing $required."
              }
            }

            $unexpected = @($entries | Where-Object { $_ -match '^extension/(node_modules|src|test|samples|out/test|\.vscode-test)/' -or $_ -match '\.(ts|map)$' })
            if ($unexpected.Count -gt 0) {
              throw "The VSIX contains development files: $($unexpected -join ', ')"
            }

            $reader = [System.IO.StreamReader]::new($archive.GetEntry('extension/package.json').Open())
            try {
              $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            }
            finally {
              $reader.Dispose()
            }
            if ($manifest.name -ne $env:EXPECTED_NAME -or $manifest.publisher -ne $env:EXPECTED_PUBLISHER -or $manifest.version -ne $env:EXPECTED_VERSION) {
              throw 'The packaged package.json identity does not match the source manifest.'
            }

            $reader = [System.IO.StreamReader]::new($archive.GetEntry('extension.vsixmanifest').Open())
            try {
              [xml] $vsixManifest = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
            $namespaces = [System.Xml.XmlNamespaceManager]::new($vsixManifest.NameTable)
            $namespaces.AddNamespace('vsix', 'http://schemas.microsoft.com/developer/vsx-schema/2011')
            $preReleaseProperties = @($vsixManifest.SelectNodes(
              "/vsix:PackageManifest/vsix:Metadata/vsix:Properties/vsix:Property[@Id='Microsoft.VisualStudio.Code.PreRelease']",
              $namespaces))
            $expected = if ($env:PRE_RELEASE -eq 'true') { 1 } else { 0 }
            if ($preReleaseProperties.Count -ne $expected) {
              throw "Expected $expected pre-release properties in the VSIX manifest, found $($preReleaseProperties.Count)."
            }
          }
          finally {
            $archive.Dispose()
          }

          $file = Get-Item -LiteralPath $packagePath
          $hash = Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
          Write-Host "Validated $($file.Name): $($file.Length) bytes, $($entries.Count) entries, SHA256 $($hash.Hash)."

      - name: Upload VSIX
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.manifest.outputs.name }}-vsix
          path: ${{ runner.temp }}/${{ steps.manifest.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to Visual Studio Marketplace
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: visual-studio-code-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=${{ needs.build.outputs.publisher }}.${{ needs.build.outputs.name }}
    defaults:
      run:
        working-directory: extensions/VisualStudioCode/xml-editor
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Confirm the version is not on the Marketplace yet
        id: availability
        shell: pwsh
        env:
          EXTENSION_ID: ${{ needs.build.outputs.publisher }}.${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $query = @{
            filters = @(
              @{
                criteria = @(@{ filterType = 7; value = $env:EXTENSION_ID })
                pageNumber = 1
                pageSize = 1
                sortBy = 0
                sortOrder = 0
              }
            )
            assetTypes = @()
            # ExtensionQueryFlags.IncludeVersions
            flags = 1
          } | ConvertTo-Json -Depth 10 -Compress

          try {
            $result = Invoke-RestMethod `
              -Method Post `
              -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' `
              -Headers @{ Accept = 'application/json;api-version=7.1-preview.1' } `
              -ContentType 'application/json' `
              -Body $query
          }
          catch {
            throw "The Marketplace query for $($env:EXTENSION_ID) failed; refusing to publish. $($_.Exception.Message)"
          }

          $extensions = @($result.results | ForEach-Object { $_.extensions } | Where-Object { $null -ne $_ })
          if ($extensions.Count -gt 1) {
            throw "The Marketplace returned more than one match for $($env:EXTENSION_ID)."
          }

          $published = @()
          if ($extensions.Count -eq 1) {
            $identity = "$($extensions[0].publisher.publisherName).$($extensions[0].extensionName)"
            if (-not [string]::Equals($identity, $env:EXTENSION_ID, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "The Marketplace returned $identity for $($env:EXTENSION_ID)."
            }
            $published = @($extensions[0].versions | ForEach-Object { $_.version })
          }

          $publish = ($published -notcontains $env:VERSION).ToString().ToLowerInvariant()
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($publish -eq 'true') {
            Write-Host "$($env:EXTENSION_ID) $($env:VERSION) is not on the Marketplace; publishing."
          }
          else {
            Write-Host "$($env:EXTENSION_ID) $($env:VERSION) is already published; nothing to do."
            @"
          ## Visual Studio Marketplace

          ``$($env:EXTENSION_ID)`` ``$($env:VERSION)`` is already published, so nothing was released.
          Bump ``version`` in ``extensions/VisualStudioCode/xml-editor/package.json`` to publish a new release.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Set up Node.js
        if: steps.availability.outputs.publish == 'true'
        # actions/setup-node v4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/VisualStudioCode/xml-editor/package-lock.json

      - name: Install the pinned vsce
        if: steps.availability.outputs.publish == 'true'
        # The publish step runs the package-lock version of vsce with --no-install, so the only
        # process that sees the Marketplace token never downloads executable npm code.
        run: npm ci

      - name: Download VSIX
        if: steps.availability.outputs.publish == 'true'
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.name }}-vsix
          path: ${{ runner.temp }}/vsix

      - name: Publish
        if: steps.availability.outputs.publish == 'true'
        shell: pwsh
        env:
          EXTENSION_ID: ${{ needs.build.outputs.publisher }}.${{ needs.build.outputs.name }}
          PRE_RELEASE: ${{ needs.build.outputs.pre-release }}
          VERSION: ${{ needs.build.outputs.version }}
          VSIX: ${{ needs.build.outputs.vsix }}
          # vsce reads VSCE_PAT by convention.
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VSCE_PAT)) {
            throw 'Configure the VS_MARKETPLACE_TOKEN secret (Azure DevOps PAT, All accessible organizations, Marketplace Manage scope) for this repository.'
          }
          Write-Host "::add-mask::$($env:VSCE_PAT)"

          $arguments = @('publish', '--packagePath', (Join-Path $env:RUNNER_TEMP "vsix/$env:VSIX"))
          if ($env:PRE_RELEASE -eq 'true') {
            $arguments += '--pre-release'
          }

          & npx --no-install vsce @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing $($env:EXTENSION_ID) $($env:VERSION) failed with exit code $LASTEXITCODE."
          }

          $channel = if ($env:PRE_RELEASE -eq 'true') { 'pre-release' } else { 'stable' }
          @"
          ## Visual Studio Marketplace

          Published ``$($env:EXTENSION_ID)`` ``$($env:VERSION)`` on the $channel channel.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
